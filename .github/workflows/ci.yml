name: CI Testing Pipeline

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    # This creates a temporary, empty Postgres database just for testing
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Temporary PostgreSQL Database
        run: pnpm run db:init
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/testdb?schema=public"

      - name: Seed Demo Login
        run: pnpm run db:seed:demo
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/testdb?schema=public"

      - name: Run Identity Service E2E Tests
        run: pnpm --filter identity-service run test:e2e
        env:
          # Tests will run against the temporary database
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/testdb?schema=public"
          JWT_SECRET: "test-secret-key"

      - name: Run Resource Service E2E Tests
        run: pnpm --filter resource-service run test:e2e
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/testdb?schema=public"
          JWT_SECRET: "test-secret-key"
          
