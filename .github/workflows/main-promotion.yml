name: Main promotion

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: main-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main-promotion-policy:
    name: Main promotion policy
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require the repository dev branch as the source
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$SOURCE_BRANCH" != "dev" || "$SOURCE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "Pull requests into main must come from resourcehive-team/resourcehive:dev." >&2
            exit 1
          fi
