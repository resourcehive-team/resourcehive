name: resourcehive-production

services:
  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: resourcehive-api-gateway-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - identity-service

  identity-service:
    image: ghcr.io/resourcehive-team/resourcehive-identity:latest
    container_name: resourcehive-identity-prod
    restart: always
    environment:
      # EC2 injects env vars from the .env file on the server
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_URL: ${APP_URL}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      EMAIL_VERIFICATION_TOKEN_EXPIRES_IN: ${EMAIL_VERIFICATION_TOKEN_EXPIRES_IN:-24h}
      PASSWORD_RESET_TOKEN_EXPIRES_IN: ${PASSWORD_RESET_TOKEN_EXPIRES_IN:-1h}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      EMAIL_FROM: ${EMAIL_FROM}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      NODE_ENV: production
    command: >
      sh -c "
        pnpm run db:migrate &&
        pnpm --filter identity-service run start:prod
      "
