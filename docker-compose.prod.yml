name: resourcehive-production

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: resourcehive-redis-prod
    restart: always
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Services ──────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: resourcehive-api-gateway-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - identity-service

  identity-service:
    image: ghcr.io/resourcehive-team/resourcehive-identity:latest
    container_name: resourcehive-identity-prod
    restart: always
    environment:
      # EC2 injects env vars from the .env file on the server
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: production
    command: >
      sh -c "
        pnpm run db:migrate &&
        pnpm --filter identity-service run start:prod
      "
    depends_on:
      redis:
        condition: service_healthy



volumes:
  redis_data_prod:
