name: resourcehive-production

services:
  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: resourcehive-api-gateway-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - identity-service

  identity-service:
    image: ghcr.io/resourcehive-team/resourcehive-identity:latest
    container_name: resourcehive-identity-prod
    restart: always
    environment:
      # EC2 injects env vars from the .env file on the server
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS}
      NODE_ENV: production
    command: >
      sh -c "
        pnpm run db:migrate &&
        pnpm --filter identity-service run start:prod
      "
