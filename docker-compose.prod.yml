name: resourcehive-production

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: resourcehive-redis-prod
    restart: always
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Services ──────────────────────────────────────────────────────────
  identity-service:
    image: ghcr.io/resourcehive-team/resourcehive-identity:latest
    container_name: resourcehive-identity-prod
    restart: always
    environment:
      # EC2 injects env vars from the .env file on the server
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: production
    ports:
      - "3001:3000"
    depends_on:
      redis:
        condition: service_healthy

  # ── Frontend ───────────────────────────────────────────────────────────────
  landing-service:
    build:
      context: ./services/landing-service
    container_name: resourcehive-landing-prod
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./services/landing-service:/usr/share/nginx/html

volumes:
  redis_data_prod:
