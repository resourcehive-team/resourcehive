name: resourcehive

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: resourcehive-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Services ──────────────────────────────────────────────────────────

  identity-service:
    image: node:20
    container_name: resourcehive-identity
    restart: unless-stopped
    working_dir: /usr/src/app/services/identity-service
    volumes:
      - ./:/usr/src/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: development
      CI: "true"
    command: >
      sh -c "
        npm install -g pnpm@10.34.5 &&
        cd /usr/src/app &&
        pnpm --filter @resourcehive/database run generate &&
        pnpm --filter @resourcehive/database run build &&
        cd services/identity-service &&
        pnpm run start:dev
      "
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy

  # ── Frontend (placeholder until Next.js app is ready) ────────────────────────

  landing-service:
    build:
      context: ./services/landing-service
    container_name: resourcehive-landing
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./services/landing-service:/usr/share/nginx/html

# ── Named Volumes (managed by Docker, never in git) ──────────────────────────

volumes:
  redis_data:
