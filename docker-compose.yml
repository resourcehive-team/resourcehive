name: resourcehive

services:
  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: resourcehive-api-gateway
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      - identity-service

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: resourcehive-identity
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      NODE_ENV: development
    command: >
      sh -c "
        pnpm run db:migrate &&
        pnpm --filter identity-service run start:prod
      "
    ports:
      - "3001:3000"
