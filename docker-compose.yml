name: resourcehive

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: resourcehive-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-topics:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command:
      - /bin/bash
      - -ec
      - |
        for topic in \
          resourcehive.notification.commands.v1 \
          resourcehive.identity.notification-commands.v1 \
          resourcehive.booking.events.v1 \
          resourcehive.notification.dead-letter.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions 1 --replication-factor 1
        done

  api-gateway:
    image: caddy:2-alpine
    container_name: resourcehive-api-gateway
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      API_DOMAIN: ${API_DOMAIN:-http://localhost:8000}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./services/api-gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      identity-service:
        condition: service_healthy
      resource-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: resourcehive-identity
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      EMAIL_VERIFICATION_TOKEN_EXPIRES_IN: ${EMAIL_VERIFICATION_TOKEN_EXPIRES_IN:-24h}
      PASSWORD_RESET_TOKEN_EXPIRES_IN: ${PASSWORD_RESET_TOKEN_EXPIRES_IN:-1h}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-console}
      EMAIL_FROM: ${EMAIL_FROM:-ResourceHive <no-reply@resourcehive.local>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:29092
      NODE_ENV: development
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
    command: >-
      sh -c "pnpm --filter @resourcehive/database exec prisma migrate deploy
      --schema ../../db/schema/schema.prisma &&
      exec pnpm --filter identity-service run start:prod"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  resource-service:
    build:
      context: .
      dockerfile: services/resource-service/Dockerfile
    container_name: resourcehive-resource
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3004
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:29092
      NODE_ENV: development
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    container_name: resourcehive-booking
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3002
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:29092
      NODE_ENV: development
    depends_on:
      kafka-topics:
        condition: service_completed_successfully

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: resourcehive-notification
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3003
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      NODE_ENV: development
      KAFKA_ENABLED: "true"
      KAFKA_BROKERS: kafka:29092
      KAFKA_CLIENT_ID: notification-service
      KAFKA_CONSUMER_GROUP: notification-service-v1
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
