name: resourcehive

services:
  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: resourcehive-api-gateway
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      - identity-service
      - resource-service
      - booking-service
      - notification-service

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: resourcehive-identity
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_UNPOOLED: ${DATABASE_URL_UNPOOLED}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      NODE_ENV: development
    command: >
      sh -c "
        pnpm run db:migrate &&
        pnpm --filter identity-service run start:prod
      "
    ports:
      - "3001:3000"

  resource-service:
    build:
      context: .
      dockerfile: services/resource-service/Dockerfile
    container_name: resourcehive-resource
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3004
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      NODE_ENV: development

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    container_name: resourcehive-booking
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3002
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      NODE_ENV: development

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: resourcehive-notification
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3003
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      NODE_ENV: development
