services:
  postgres:
    image: postgres:15-alpine
    container_name: resourcehive-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: resourcehive
    ports:
      - "5432:5432"
    volumes:
      - ./postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: resourcehive-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis:/data

  landing-service:
    build:
      context: ./services/landing-service
    container_name: resourcehive-landing
    ports:
      - "8080:80"
    volumes:
      - ./services/landing-service:/usr/share/nginx/html